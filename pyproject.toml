[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pTVreg"
version = "0.1.0"
description = "PyTorch implementation of the pTVreg image registration algorithms."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "nibabel",
    "kornia"
]

[project.scripts]
ptvreg = "pTVreg.cli:main"
ptvwarp = "pTVreg.cli_warp:main"

[tool.setuptools.packages.find]
include = ["pTVreg", "pTVreg.*"]
